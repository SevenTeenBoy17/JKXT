<style>
  :root {
    --bg-base: #F5F7FA;
    --bg-elevated: #FFFFFF;
    --border-soft: #E4E7EC;
    --border-strong: #CBD5E1;
    --text-strong: #0F172A;
    --text-medium: #475569;
    /* 迭代9 P1-O: 原 #94A3B8 对白底仅 2.56:1(WCAG 不达标)，全站 271 处复用(标签/表头/时间/占位符)。
       调暗至 #64748B(slate-500)=4.76:1 满足 WCAG AA 正文对比度，惠及低视力/强光/老花。 */
    --text-soft: #64748B;

    --brand: #4F46E5;
    --brand-hover: #4338CA;
    --brand-soft: #EEF2FF;

    --success: #10B981;
    --success-soft: #DCFCE7;
    --warning: #F59E0B;
    --warning-soft: #FEF3C7;
    --danger: #EF4444;
    --danger-soft: #FEE2E2;
    --info: #0EA5E9;
    --info-soft: #E0F2FE;

    --kpi-1-bg: #EEF2FF;  --kpi-1-fg: #4F46E5;
    --kpi-2-bg: #ECFDF5;  --kpi-2-fg: #059669;
    --kpi-3-bg: #FFF7ED;  --kpi-3-fg: #D97706;
    --kpi-4-bg: #FAF5FF;  --kpi-4-fg: #9333EA;

    --pill-1: #6366F1;
    --pill-2: #10B981;
    --pill-3: #F59E0B;
    --pill-4: #EF4444;
    --pill-5: #06B6D4;
    --pill-6: #EC4899;

    --shadow-card: 0 1px 0 rgba(255,255,255,.85) inset, 0 1px 3px rgba(15, 23, 42, .04), 0 4px 12px -4px rgba(15, 23, 42, .06);
    --shadow-focus: 0 0 0 3px rgba(79,70,229,.16);
    --shadow-hover: 0 1px 0 rgba(255,255,255,.85) inset, 0 4px 8px rgba(15, 23, 42, .06), 0 16px 32px -8px rgba(15, 23, 42, .12);
    --elevation-1: 0 1px 0 rgba(255,255,255,.85) inset, 0 1px 3px rgba(15,23,42,.04), 0 1px 2px rgba(15,23,42,.02);
    --elevation-2: 0 1px 0 rgba(255,255,255,.85) inset, 0 2px 6px rgba(15,23,42,.06), 0 8px 18px -4px rgba(15,23,42,.08);
    --elevation-3: 0 1px 0 rgba(255,255,255,.85) inset, 0 4px 12px rgba(15,23,42,.10), 0 18px 36px -8px rgba(15,23,42,.14);

    --ease: cubic-bezier(.4, 0, .2, 1);
  }
  html, body {
    margin: 0;
    background: var(--bg-base);
    color: var(--text-strong);
    font-family: 'Geist', 'PingFang SC', 'Microsoft YaHei UI', 'Noto Sans CJK SC', system-ui, sans-serif;
    font-feature-settings: "cv11", "ss01", "ss03";
    -webkit-font-smoothing: antialiased;
  }
  .font-mono, .num {
    font-family: 'Geist Mono', monospace;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .shadow-card { box-shadow: var(--shadow-card); }
  .shadow-hover { box-shadow: var(--shadow-hover); }
  .elev-1 { box-shadow: var(--elevation-1); }
  .elev-2 { box-shadow: var(--elevation-2); }
  .elev-3 { box-shadow: var(--elevation-3); }

  .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
  .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }

  /* tactile transitions */
  .hover-lift {
    transition: transform 160ms var(--ease), box-shadow 160ms var(--ease);
  }
  .hover-lift:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-hover);
  }

  /* kbd */
  .kbd {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    background: #F1F5F9;
    color: #475569;
    border: 1px solid #E2E8F0;
    border-bottom-width: 1.5px;
    border-radius: 4px;
    padding: 1px 5px;
    line-height: 1;
  }

  /* timeline pill subtle inset highlight */
  .timeline-pill {
    box-shadow: var(--elevation-1), inset 0 1px 0 rgba(255,255,255,.18);
  }

  /* sparkline accent */
  .spark-grid line { stroke: rgba(15,23,42,.04); }

  /* loading skeleton (unused but kept as token) */
  @keyframes sweep { 0%{background-position: -200% 0} 100%{background-position: 200% 0} }

  /* ── Responsive shell ──────────────────────────────────────────────
     Replaces the old hard `min-w-[1280px]` lock + fixed 1280 viewport.
     The workstation layout stays fluid on standard desktops/laptops and
     degrades gracefully (horizontal scroll) on narrow/tablet widths,
     instead of forcing a zoomed-out 1280 canvas on phones. */
  .app-body {
    width: 100%;
    min-width: 0;
    overflow-x: hidden;
  }
  @media (min-width: 1081px) {
    .app-body { min-width: 0; } /* truly fluid above the floor — reflows with the window */
  }
  /* Tighten the main content gutters as the window narrows so tables
     and KPI rows keep breathing room without overflowing. */
  @media (max-width: 1280px) {
    main > .page-transition-stage .px-8 { padding-left: 1.5rem; padding-right: 1.5rem; }
  }

  html {
    overflow-x: hidden;
  }
  .app-shell,
  .app-layout,
  .app-main,
  .page-transition-stage,
  .page-layer {
    min-width: 0;
  }
  .app-sidebar {
    width: 240px;
    flex: 0 0 240px;
  }
  .app-page-pad {
    padding: 1.75rem 2rem;
  }
  .mobile-nav-backdrop,
  .mobile-menu-trigger {
    display: none;
  }
  @media (max-width: 1023px) {
    .app-topbar {
      height: 56px !important;
      padding-left: max(12px, env(safe-area-inset-left)) !important;
      padding-right: max(12px, env(safe-area-inset-right)) !important;
      gap: 8px;
    }
    .mobile-menu-trigger {
      display: inline-flex;
    }
    .app-brand {
      width: auto !important;
      min-width: 0;
      max-width: 210px;
      flex: 1 1 auto;
    }
    .topbar-context,
    .topbar-search,
    .topbar-desktop-only {
      display: none !important;
    }
    .topbar-actions {
      margin-left: auto;
      gap: 4px !important;
    }
    .app-layout {
      display: block !important;
    }
    .app-main {
      width: 100%;
    }
    .app-page-pad {
      padding: 1rem;
      padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
    }
    .app-sidebar {
      position: fixed !important;
      z-index: 90;
      top: 0 !important;
      left: 0;
      bottom: 0;
      width: min(84vw, 320px);
      height: 100dvh !important;
      transform: translateX(-105%);
      transition: transform 220ms var(--ease);
      box-shadow: 24px 0 60px rgba(15,23,42,.22);
    }
    .app-shell.nav-open .app-sidebar {
      transform: translateX(0);
    }
    .mobile-nav-backdrop {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 80;
      border: 0;
      padding: 0;
      background: rgba(15,23,42,.36);
      backdrop-filter: blur(2px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms var(--ease);
    }
    .app-shell.nav-open .mobile-nav-backdrop {
      opacity: 1;
      pointer-events: auto;
    }
    .page-transition-stage {
      min-height: calc(100dvh - 56px) !important;
    }
    .grid.grid-cols-4,
    .grid.grid-cols-5,
    .grid.grid-cols-3,
    .grid.grid-cols-2,
    .dashboard-main-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    }
    .dashboard-main-grid {
      align-items: start;
    }
    .qk-step-card {
      top: 64px !important;
      padding: 1rem !important;
    }
    .qk-step-row {
      display: grid !important;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
      align-items: stretch;
    }
    .qk-step-action {
      min-width: 0;
      width: 100%;
      padding: 0.5rem;
      border-radius: 0.875rem;
      background: rgba(248,250,252,.76);
    }
    .qk-step-copy {
      min-width: 0;
    }
    .qk-step-sub {
      white-space: normal !important;
      line-height: 1.25 !important;
    }
    .qk-step-connector {
      display: none !important;
    }
    .login-clock-panel {
      padding-left: 2rem !important;
      padding-right: 2rem !important;
    }
    .login-clock-face {
      width: calc(100vw - 4rem) !important;
      font-size: clamp(88px, 13vw, 160px) !important;
    }
    .login-captcha-field {
      min-width: 0;
    }
    .login-captcha-button {
      min-width: 116px !important;
      width: 116px;
    }
    .login-captcha-img {
      width: 100% !important;
      max-width: 100% !important;
    }
  }
  @media (max-width: 640px) {
    .app-topbar {
      height: 54px !important;
    }
    .app-brand {
      max-width: 190px;
    }
    .app-brand span {
      white-space: nowrap;
    }
    .app-page-pad {
      padding: 0.875rem;
    }
    .grid.grid-cols-4,
    .grid.grid-cols-5,
    .grid.grid-cols-3,
    .grid.grid-cols-2,
    .dashboard-main-grid {
      grid-template-columns: minmax(0, 1fr) !important;
    }
    .min-w-\[400px\],
    .w-\[560px\],
    .w-\[430px\] {
      width: calc(100vw - 24px) !important;
      min-width: 0 !important;
      max-width: calc(100vw - 24px) !important;
    }
    .fixed.top-\[76px\].right-6 {
      top: 62px !important;
      right: 12px !important;
      left: 12px !important;
    }
    .fixed.top-\[76px\].right-6 > * {
      max-width: none !important;
      width: 100%;
      min-width: 0 !important;
    }
    .login-top-strip {
      padding: 0.875rem 1rem !important;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .login-top-strip > div:first-child {
      min-width: 0;
    }
    .login-top-strip img {
      max-width: 42vw;
      height: auto !important;
    }
    .login-top-strip > div:last-child {
      display: flex !important;
      flex-shrink: 0;
      margin-left: auto;
    }
    .login-clock-panel {
      display: none !important;
    }
    .login-captcha-row {
      display: grid !important;
      grid-template-columns: minmax(0, 1fr) 116px;
      gap: 0.5rem;
    }
    .login-captcha-field,
    .login-captcha-button {
      width: 100% !important;
      min-width: 0 !important;
    }
    .login-captcha-img {
      height: 34px !important;
      width: 100% !important;
    }
    .login-root .beijing-date-card,
    .login-root .login-draggable-hint {
      display: none !important;
    }
  }
  @media (max-width: 360px) {
    .qk-step-row {
      grid-template-columns: minmax(0, 1fr);
    }
    .login-brand-signature {
      left: 1.5rem !important;
      right: 1rem !important;
    }
    .login-brand-signature [data-login-brand-title] {
      font-size: 24px !important;
      letter-spacing: 0 !important;
    }
    .login-brand-signature [data-login-brand-subtitle] {
      font-size: 9px !important;
      letter-spacing: 0.18em !important;
    }
    .login-captcha-row {
      grid-template-columns: minmax(0, 1fr) 104px;
    }
  }
</style>
