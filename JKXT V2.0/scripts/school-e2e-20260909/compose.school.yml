name: jkxt-school-e2e-20260909
services:
  postgres:
    image: postgres:16
    container_name: jkxt-school-e2e-20260909-pg
    environment:
      POSTGRES_DB: jkxt_school_e2e
      POSTGRES_USER: jkxt_school_e2e
      POSTGRES_PASSWORD: ${SCHOOL_DB_PASSWORD:?private test password required}
    volumes: [school-pg:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U jkxt_school_e2e -d jkxt_school_e2e]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    container_name: jkxt-school-e2e-20260909-redis
    command: [redis-server, --save, '', --appendonly, 'no']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    image: sha256:b4727a0ef40953e5834359fad6a2f7414455e4b3153857ec733551775e7c4564
    container_name: jkxt-school-e2e-20260909-app
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      SPRING_PROFILES_ACTIVE: private
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jkxt_school_e2e
      SPRING_DATASOURCE_USERNAME: jkxt_school_e2e
      SPRING_DATASOURCE_PASSWORD: ${SCHOOL_DB_PASSWORD:?private test password required}
      SPRING_DATA_REDIS_HOST: redis
      JKXT_FIXED_ORG_ID: 00000000-0000-0000-0000-000000000001
      JKXT_AUTH_COOKIE_NAME: JKXT_E2E_20260909
      JKXT_AUTH_COOKIE_SECURE: 'false'
      JKXT_AUTH_CAPTCHA_DEBUG: 'true'
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:18190
      JKXT_EXTERNAL_SMS_ENABLED: 'false'
      JKXT_NOTIFY_EMAIL_ENABLED: 'false'
      JKXT_NOTIFY_SMS_ENABLED: 'false'
      JKXT_LLM_ENABLED: 'true'
      JKXT_LLM_ACCEPTANCE_MODE: 'true'
      JKXT_LLM_PROVIDER: aliyun
      JKXT_LLM_BASE_URL: https://ws-dgs4ei9jjypkwezu.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      JKXT_LLM_FALLBACK_BASE_URL: ''
      JKXT_LLM_API_KEY: ${SCHOOL_LLM_API_KEY:?user supplied key required}
      JKXT_LLM_MODEL: qwen-plus
      JKXT_LLM_FALLBACK_MODELS: qwen-flash
      JKXT_LLM_MAX_RETRIES: '0'
      JKXT_LLM_TIMEOUT_MS: '90000'
    ports: ['127.0.0.1:18091:8080']
    volumes: [school-uploads:/app/uploads]
  nginx:
    image: nginx:1.27-alpine
    container_name: jkxt-school-e2e-20260909-nginx
    depends_on: [app]
    ports: ['127.0.0.1:18190:80']
    volumes:
      - ../../deploy/nginx/private.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../Dashboard.html:/usr/share/nginx/html/Dashboard.html:ro
      - ../../src:/usr/share/nginx/html/src:ro
      - ../../assets:/usr/share/nginx/html/assets:ro
      - school-uploads:/usr/share/nginx/html/uploads:ro
      - ../../artifacts/school-e2e-20260909:/usr/share/nginx/html/acceptance:ro
volumes:
  school-pg:
  school-uploads:
