name: jkxt-private

services:
  postgres:
    image: postgres:16
    container_name: jkxt-private-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jkxt_private}
      POSTGRES_USER: ${POSTGRES_USER:-jkxt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_private_password}
    ports:
      - "${PRIVATE_POSTGRES_PORT:-15432}:5432"
    volumes:
      - jkxt-private-postgres-data:/var/lib/postgresql/data
      - jkxt-private-backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: jkxt-private-redis
    restart: unless-stopped
    ports:
      - "${PRIVATE_REDIS_PORT:-16379}:6379"
    volumes:
      - jkxt-private-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ./backend
    container_name: jkxt-private-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: private
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jkxt_private}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-jkxt}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change_me_private_password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      API_PUBLIC_BASE: /api/v1
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:18180,http://localhost:18180}
      JKXT_VERSION: ${JKXT_VERSION:-0.12.0-p12}
      JKXT_DEPLOY_MODE: private
      JKXT_FIXED_ORG_ID: ${JKXT_FIXED_ORG_ID:-00000000-0000-0000-0000-000000000001}
      JKXT_EXTERNAL_SMS_ENABLED: "false"
      JKXT_AUTH_CAPTCHA_DEBUG: ${JKXT_AUTH_CAPTCHA_DEBUG:-true}
      JKXT_AUTH_COOKIE_SECURE: ${JKXT_AUTH_COOKIE_SECURE:-false}
      # 仅 nginx 容器(docker bridge 网段)写的 X-Forwarded-For 才被采信为客户端 IP，见 application-private.yml。
      JKXT_AUTH_TRUSTED_PROXIES: ${JKXT_AUTH_TRUSTED_PROXIES:-172.16.0.0/12}
      JKXT_LLM_ENABLED: ${JKXT_LLM_ENABLED:-false}
      JKXT_LLM_ACCEPTANCE_MODE: ${JKXT_LLM_ACCEPTANCE_MODE:-false}
      JKXT_LLM_PROVIDER: ${JKXT_LLM_PROVIDER:-aliyun}
      JKXT_LLM_BASE_URL: ${JKXT_LLM_BASE_URL:-}
      JKXT_LLM_FALLBACK_BASE_URL: ${JKXT_LLM_FALLBACK_BASE_URL:-}
      JKXT_LLM_API_KEY: ${JKXT_LLM_API_KEY:-}
      JKXT_LLM_MODEL: ${JKXT_LLM_MODEL:-qwen-plus}
      JKXT_LLM_FALLBACK_MODELS: ${JKXT_LLM_FALLBACK_MODELS:-qwen-flash}
      JKXT_LLM_TIMEOUT_MS: ${JKXT_LLM_TIMEOUT_MS:-60000}
      JKXT_LLM_MAX_OUTPUT_TOKENS: ${JKXT_LLM_MAX_OUTPUT_TOKENS:-4096}
      JKXT_LLM_MAX_RETRIES: ${JKXT_LLM_MAX_RETRIES:-2}
    ports:
      # 只绑回环：这条端口是绕开 nginx 的后端旁路，仅供本机调试/swagger。绝不能暴露到校园网——
      # ①它让任何人都能跳过 nginx(及其 TLS/头部/限流)直连后端；②经 docker NAT 后 app 看到的对端是
      # docker 网关(实测 172.19.0.1)，正落在上面 JKXT_AUTH_TRUSTED_PROXIES 的 172.16.0.0/12 内，
      # 会被判为可信代理而采信调用方自带的 X-Forwarded-For，使审计 IP 可伪造（实测：直连该端口带
      # XFF: 1.2.3.4 → last_login_ip 被写成 1.2.3.4）。绑回环后该旁路仅限本机。
      # 正常访问一律走 nginx 的 ${PRIVATE_HTTP_PORT:-18180}。
      - "127.0.0.1:${PRIVATE_BACKEND_PORT:-18081}:8080"
    volumes:
      - jkxt-private-backups:/var/backups/jkxt

  nginx:
    image: nginx:1.27-alpine
    container_name: jkxt-private-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "${PRIVATE_HTTP_PORT:-18180}:80"
    volumes:
      - ./deploy/nginx/private.conf:/etc/nginx/conf.d/default.conf:ro
      - ./Dashboard.html:/usr/share/nginx/html/Dashboard.html:ro
      - ./src:/usr/share/nginx/html/src:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./uploads:/usr/share/nginx/html/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/v1/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12

  backup:
    image: postgres:16
    container_name: jkxt-private-backup
    profiles:
      - ops
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jkxt_private}
      POSTGRES_USER: ${POSTGRES_USER:-jkxt}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change_me_private_password}
    volumes:
      - jkxt-private-backups:/backups
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      ts=$$(date +%Y%m%d-%H%M%S);
      pg_dump -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" > "/backups/jkxt-private-$$ts.sql";
      sha256sum "/backups/jkxt-private-$$ts.sql" > "/backups/jkxt-private-$$ts.sql.sha256";
      ls -lh /backups

volumes:
  jkxt-private-postgres-data:
  jkxt-private-redis-data:
  jkxt-private-backups:
