name: jkxt-public

services:
  postgres:
    image: postgres:16
    container_name: jkxt-public-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jkxt_public}
      POSTGRES_USER: ${POSTGRES_USER:-jkxt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - jkxt-public-postgres-data:/var/lib/postgresql/data
      - jkxt-public-backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: jkxt-public-redis
    volumes:
      - jkxt-public-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: ./backend
    container_name: jkxt-public-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-private}
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jkxt_public}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-jkxt}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      API_PUBLIC_BASE: /api/v1
      APP_BASE_URL: ${APP_BASE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JKXT_VERSION: ${JKXT_VERSION:-0.12.0-p12-public}
      JKXT_DEPLOY_MODE: ${JKXT_DEPLOY_MODE:-private}
      JKXT_FIXED_ORG_ID: ${JKXT_FIXED_ORG_ID:-00000000-0000-0000-0000-000000000001}
      JKXT_EXTERNAL_SMS_ENABLED: ${JKXT_EXTERNAL_SMS_ENABLED:-false}
      JKXT_AUTH_CAPTCHA_DEBUG: ${JKXT_AUTH_CAPTCHA_DEBUG:-false}
      JKXT_AUTH_COOKIE_SECURE: ${JKXT_AUTH_COOKIE_SECURE:-true}
      JKXT_AUTH_COOKIE_SAME_SITE: ${JKXT_AUTH_COOKIE_SAME_SITE:-Lax}
      # caddy → nginx → app 都在 docker bridge 网段内；仅该网段的直连对端写的 X-Forwarded-For 被采信，
      # 故公网客户端真实 IP 仍能被正确取到(取最右侧非可信段)。见 application-private.yml。
      JKXT_AUTH_TRUSTED_PROXIES: ${JKXT_AUTH_TRUSTED_PROXIES:-172.16.0.0/12}
      JKXT_LLM_ENABLED: ${JKXT_LLM_ENABLED:-false}
      JKXT_LLM_ACCEPTANCE_MODE: ${JKXT_LLM_ACCEPTANCE_MODE:-false}
      JKXT_LLM_PROVIDER: ${JKXT_LLM_PROVIDER:-aliyun}
      JKXT_LLM_BASE_URL: ${JKXT_LLM_BASE_URL:-}
      JKXT_LLM_FALLBACK_BASE_URL: ${JKXT_LLM_FALLBACK_BASE_URL:-}
      JKXT_LLM_API_KEY: ${JKXT_LLM_API_KEY:-}
      JKXT_LLM_MODEL: ${JKXT_LLM_MODEL:-qwen-plus}
      JKXT_LLM_FALLBACK_MODELS: ${JKXT_LLM_FALLBACK_MODELS:-qwen-flash}
      JKXT_LLM_TIMEOUT_MS: ${JKXT_LLM_TIMEOUT_MS:-60000}
      JKXT_LLM_MAX_OUTPUT_TOKENS: ${JKXT_LLM_MAX_OUTPUT_TOKENS:-4096}
      JKXT_LLM_MAX_RETRIES: ${JKXT_LLM_MAX_RETRIES:-2}
      JKXT_LLM_MONTHLY_QUOTA: ${JKXT_LLM_MONTHLY_QUOTA:-1000}
    volumes:
      - jkxt-public-backups:/var/backups/jkxt
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: jkxt-public-nginx
    depends_on:
      app:
        condition: service_started
    volumes:
      - ./deploy/nginx/private.conf:/etc/nginx/conf.d/default.conf:ro
      - ./Dashboard.html:/usr/share/nginx/html/Dashboard.html:ro
      - ./src:/usr/share/nginx/html/src:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./uploads:/usr/share/nginx/html/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/v1/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    container_name: jkxt-public-caddy
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - jkxt-public-caddy-data:/data
      - jkxt-public-caddy-config:/config
    restart: unless-stopped

  backup:
    image: postgres:16
    container_name: jkxt-public-backup
    profiles:
      - ops
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jkxt_public}
      POSTGRES_USER: ${POSTGRES_USER:-jkxt}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - jkxt-public-backups:/backups
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      ts=$$(date +%Y%m%d-%H%M%S);
      pg_dump -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" > "/backups/jkxt-public-$$ts.sql";
      sha256sum "/backups/jkxt-public-$$ts.sql" > "/backups/jkxt-public-$$ts.sql.sha256";
      ls -lh /backups

volumes:
  jkxt-public-postgres-data:
  jkxt-public-redis-data:
  jkxt-public-backups:
  jkxt-public-caddy-data:
  jkxt-public-caddy-config:
