# Round 11: production TLS edge for the private (single-school) topology.
# Same routing as private.conf, plus: HTTP->HTTPS redirect, TLS 1.2/1.3 only, HSTS and baseline
# security headers. Mount the real certificate at /etc/nginx/tls/fullchain.pem and the key at
# /etc/nginx/tls/privkey.pem (read-only, never baked into an image or committed).
# Pair with JKXT_AUTH_COOKIE_SECURE=true so session cookies get Secure + the __Host- prefix.

# R11-F6: reuse upstream connections; without keepalive every proxied request opens a new TCP
# connection and a sustained ~2k req/s burst exhausted nginx's ephemeral ports (errno 99 -> 502).
upstream jkxt_app {
  server app:8080;
  keepalive 64;
}

server {
  listen 80;
  server_name _;
  location = /actuator/health { proxy_pass http://app:8080/actuator/health; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:jkxt_tls:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  root /usr/share/nginx/html;
  index Dashboard.html;
  client_max_body_size 30m;

  # SSE progress streams must not be buffered.
  location ~ ^/api/v1/(schedule-jobs|scheduling/runs)/[0-9a-fA-F-]+/events$ {
    proxy_pass http://jkxt_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/v1/ {
    proxy_pass http://jkxt_app/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Single edge: overwrite (never append) client-supplied X-Forwarded-For.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
  }

  location /actuator/health {
    proxy_pass http://app:8080/actuator/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location ~* \.(?:js|jsx|css|png|jpg|jpeg|gif|svg|webp|mp4|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri $uri/ /Dashboard.html;
    add_header Cache-Control "no-store";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}