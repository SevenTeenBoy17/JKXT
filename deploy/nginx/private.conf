server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index Dashboard.html;

  client_max_body_size 30m;

  # SSE 进度流（P18 批次5.5）：默认 proxy_buffering 会把 text/event-stream 缓冲到响应结束，
  # 事件全被扣住不下发——这正是前端此前只能 500ms 轮询 + 40 秒硬超时误报「任务超时」的根源之一。
  # 正则 location 优先于下方的前缀 location 命中。
  location ~ ^/api/v1/(schedule-jobs|scheduling/runs)/[0-9a-fA-F-]+/events$ {
    proxy_pass http://app:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # 与下方 /api/v1/ 同理：覆盖式 XFF
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;                            # 求解最长等待窗口
  }

  location /api/v1/ {
    proxy_pass http://app:8080/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # private 单边拓扑：nginx 是唯一边缘代理，此处【覆盖】而非追加 XFF——把客户端自带的任何 X-Forwarded-For
    # 直接丢弃，只放行 nginx 亲眼所见的对端($remote_addr)。这样后端拿到的 XFF 恒为可信来源，任何人都无法靠自带
    # XFF 伪造审计 IP，也不再依赖「客户端真实 IP 恰好不落在后端 trusted-proxies 网段」这一脆弱前提。
    # （若日后 private 前面再加一层可信代理，改回 $proxy_add_x_forwarded_for 并把该层网段加入 trusted-proxies。）
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /actuator/health {
    proxy_pass http://app:8080/actuator/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location ~* \.(?:js|jsx|css|png|jpg|jpeg|gif|svg|webp|mp4|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300";
  }

  location / {
    try_files $uri $uri/ /Dashboard.html;
    add_header Cache-Control "no-store";
  }
}
