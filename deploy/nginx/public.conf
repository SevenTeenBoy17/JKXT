# Public topology only: Caddy is the sole exposed ingress; nginx has no host port.
# Caddy overwrites untrusted client forwarding headers before this trusted hop.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index Dashboard.html;
  client_max_body_size 30m;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  location ~ ^/api/v1/(schedule-jobs|scheduling/runs)/[0-9a-fA-F-]+/events$ {
    proxy_pass http://app:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
  location /api/v1/ {
    proxy_pass http://app:8080/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 120s;
  }
  location /actuator/health {
    proxy_pass http://app:8080/actuator/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
  location ~* \.(?:js|jsx|css|png|jpg|jpeg|gif|svg|webp|mp4|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300";
  }
  location / {
    try_files $uri $uri/ /Dashboard.html;
    add_header Cache-Control "no-store";
  }
}
