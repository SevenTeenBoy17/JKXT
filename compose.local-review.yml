# Local source-review stack. No production data, no externally published DB/Redis.
name: jkxt-source-review
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: jkxt_review
      POSTGRES_USER: jkxt_review
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.review}
    volumes:
      - postgres-review:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    command: [redis-server, --save, '', --appendonly, 'no']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build:
      context: ./JKXT V2.0/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: private
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jkxt_review
      SPRING_DATASOURCE_USERNAME: jkxt_review
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.review}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: '6379'
      JKXT_DEPLOY_MODE: private
      JKXT_FIXED_ORG_ID: 00000000-0000-0000-0000-000000000001
      JKXT_AUTH_CAPTCHA_DEBUG: 'true'
      JKXT_AUTH_COOKIE_SECURE: 'false'
      JKXT_AUTH_TRUSTED_PROXIES: 172.16.0.0/12
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:${REVIEW_HTTP_PORT:-18290},http://localhost:${REVIEW_HTTP_PORT:-18290}
      JKXT_LLM_ENABLED: 'false'
      JKXT_LLM_ACCEPTANCE_MODE: 'false'
      JKXT_LLM_API_KEY: ''
      JKXT_LLM_BASE_URL: ''
      JKXT_EXTERNAL_SMS_ENABLED: 'false'
      JKXT_NOTIFY_EMAIL_ENABLED: 'false'
      JKXT_NOTIFY_SMS_ENABLED: 'false'
    volumes:
      - backups-review:/var/backups/jkxt
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_started
    ports:
      - '127.0.0.1:${REVIEW_HTTP_PORT:-18290}:80'
    volumes:
      - './JKXT V2.0/deploy/nginx/private.conf:/etc/nginx/conf.d/default.conf:ro'
      - './JKXT V2.0/Dashboard.html:/usr/share/nginx/html/Dashboard.html:ro'
      - './JKXT V2.0/src:/usr/share/nginx/html/src:ro'
      - './JKXT V2.0/assets:/usr/share/nginx/html/assets:ro'
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1/api/v1/health | grep -q UP']
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  postgres-review:
  backups-review:
